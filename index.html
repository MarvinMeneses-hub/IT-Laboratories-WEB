<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151416">
  <meta name="description" content="Marvin M. Meneses — Web System and Technology laboratory activities and independent projects portfolio.">
  <title>Marvin Meneses | Academic Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #E99AAF;
      --pink-soft: #FCE7ED;
      --canvas: #FFFFFF;
      --slate: #66535A;
      --ink: #30252A;
      --rose: #A83E61;
      --gold: #FFE2A0;
      --night: #151416;
      --line: #F0DDE3;
      --surface: #FFF7F9;
      --green: #26734D;
      --green-soft: #E8F6EE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; }
    body { min-height: 100vh; font-family: "DM Sans", sans-serif; background: var(--canvas); color: var(--ink); }
    button, a { font: inherit; }
    a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible { outline: 3px solid #B64D70; outline-offset: 5px; }
    .welcome-screen {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 28px 20px; color: #F8EDF0;
      background: radial-gradient(ellipse at 50% 70%, #272126 0%, #1B191C 38%, #111113 78%);
      transition: opacity 1.25s ease, visibility 1.25s ease;
    }
    .welcome-screen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .2;
      background-image: radial-gradient(#FFF 0.5px, transparent 0.5px); background-size: 7px 7px;
      mask-image: linear-gradient(to bottom, transparent, black 70%, transparent);
    }
    .welcome-screen::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at 50% 52%, rgba(255,218,150,.36), rgba(241,184,198,.12) 35%, transparent 72%);
      transition: opacity 2s ease;
    }
    .welcome-screen.lamp-on::after { opacity: 1; }
    .welcome-screen.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: min(100%, 520px); text-align: center; transform: translateY(-10px); }
    .intro-eyebrow { margin-bottom: 15px; color: #9D9299; font-size: 10px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
    .intro-title { font-family: "Playfair Display", serif; font-size: clamp(2rem, 6vw, 3.3rem); font-weight: 500; line-height: 1.15; letter-spacing: -.035em; }
    .intro-title span { color: var(--pink); font-style: italic; }
    .intro-description { max-width: 330px; margin-top: 14px; color: #B8ADB3; font-size: 13px; line-height: 1.8; }
    .lamp-button { position: relative; display: flex; align-items: center; justify-content: center; width: min(100%, 350px); height: 340px; margin-top: 3px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .lamp-button:focus-visible { outline: 2px solid rgba(255,226,160,.7); outline-offset: -14px; }
    .lamp-halo { position: absolute; top: 20%; left: 50%; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,219,151,.05), rgba(255,219,151,.015) 42%, transparent 70%); opacity: .75; transform: translateX(-50%); transition: all 1.5s ease; }
    .lamp-button:hover .lamp-halo { background: radial-gradient(circle, rgba(255,219,151,.12), rgba(255,219,151,.025) 50%, transparent 72%); }
    .lamp-beam { position: absolute; top: 29%; left: 50%; width: 0; height: 0; border-left: 112px solid transparent; border-right: 112px solid transparent; border-top: 215px solid rgba(255,220,155,0); filter: blur(14px); transform: translateX(-50%); transform-origin: top center; transition: border-top-color 1.8s ease, filter 1.8s ease, transform 1.8s ease; }
    .lamp-illustration { position: relative; z-index: 2; width: 190px; height: 255px; overflow: visible; filter: drop-shadow(0 5px 12px rgba(0,0,0,.4)); transition: filter 1.5s ease; }
    .lamp-bulb { fill: #766A5D; transition: fill 1.3s ease, filter 1.3s ease; }
    .lamp-shade { fill: #373239; stroke: #5B5158; stroke-width: 1.2; transition: fill 1.3s ease, stroke 1.3s ease; }
    .lamp-stem { stroke: #4C444A; stroke-width: 7; stroke-linecap: round; transition: stroke 1.3s ease; }
    .lamp-base { fill: #393238; stroke: #5A5056; stroke-width: 1; transition: fill 1.3s ease; }
    .lamp-floor-light { position: absolute; bottom: 26px; left: 50%; width: 110px; height: 15px; border-radius: 50%; background: rgba(255,217,145,0); filter: blur(10px); transform: translateX(-50%); transition: all 1.8s ease; }
    .lamp-instruction { margin-top: -9px; color: #B8ADB3; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; animation: breathe 2.6s ease-in-out infinite; }
    .lamp-instruction span { display: inline-block; margin-right: 7px; color: var(--pink); }
    .intro-footer { position: absolute; bottom: 25px; color: #80757D; font-size: 10px; letter-spacing: .12em; text-align: center; }
    .welcome-screen.lamp-on .lamp-bulb { fill: #FFF0C4; filter: drop-shadow(0 0 8px #FFE7AC) drop-shadow(0 0 24px #FFCB70) drop-shadow(0 0 44px rgba(255,194,95,.85)); }
    .welcome-screen.lamp-on .lamp-shade { fill: #67505A; stroke: #A78B83; }
    .welcome-screen.lamp-on .lamp-stem { stroke: #A18B7C; }
    .welcome-screen.lamp-on .lamp-base { fill: #65515A; }
    .welcome-screen.lamp-on .lamp-halo { width: 430px; height: 430px; background: radial-gradient(circle, rgba(255,224,163,.38), rgba(255,205,133,.16) 33%, rgba(241,184,198,.07) 52%, transparent 72%); }
    .welcome-screen.lamp-on .lamp-beam { border-top-color: rgba(255,222,162,.27); filter: blur(22px); transform: translateX(-50%) scale(1.55); }
    .welcome-screen.lamp-on .lamp-floor-light { width: 270px; height: 42px; background: rgba(255,217,145,.36); box-shadow: 0 0 45px 25px rgba(255,217,145,.12); }
    .welcome-screen.lamp-on .lamp-instruction { color: #FFE5B0; animation: none; }
    .welcome-screen.lamp-on .lamp-illustration { filter: drop-shadow(0 0 24px rgba(255,211,136,.25)); }
    .dust { position: absolute; z-index: 1; width: 3px; height: 3px; border-radius: 50%; background: #FFE5B0; opacity: 0; box-shadow: 0 0 8px rgba(255,222,162,.9); pointer-events: none; }
    .welcome-screen.lamp-on .dust { animation: floatDust 3s ease-in-out infinite; }
    .dust-one { top: 44%; left: 30%; animation-delay: .1s; }
